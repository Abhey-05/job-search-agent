{% extends "base.html" %}
{% block content %}
<h2>Run history</h2>
<table>
  <tr><th>ID</th><th>Mode</th><th>Started</th><th>Finished</th><th>Status</th><th>Summary</th></tr>
  {% for r in runs %}
  <tr>
    <td>{{ r['id'] }}</td>
    <td>{{ r['mode'] }}</td>
    <td class="muted">{{ r['started_at'] }}</td>
    <td class="muted">{{ r['finished_at'] or 'in progress' }}</td>
    <td>{{ r['status'] }}</td>
    <td><pre>{{ r['summary_json'] }}</pre></td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
