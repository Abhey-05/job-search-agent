# Render Blueprint. Creates the managed Postgres database and the
# dashboard web service in one pass ("New + -> Blueprint" in the Render
# dashboard, pointed at this repo).
#
# NOT included here: the scheduled run. Render's Cron Job schedule field
# is dashboard-only (not confirmed to be Blueprint-configurable as of this
# writing) -- create it manually as a second service after this Blueprint
# runs: a Cron Job with command `python -m app run` and the UTC cron
# expression shown on the dashboard's /schedule page. See docs/DEPLOYMENT.md.
#
# Nothing here provisions anything until you import this Blueprint in your
# own Render account and approve the plan it shows you (including the
# Postgres cost after its 30-day free trial).

databases:
  - name: job-search-agent-db
    plan: free
    databaseName: jobsearch
    user: jobsearch

services:
  - type: web
    name: job-search-agent-dashboard
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-search-agent-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
      # Secrets -- set these values yourself in the Render dashboard after
      # import (sync: false means the Blueprint won't set or overwrite them).
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
